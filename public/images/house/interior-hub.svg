<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#efe6d6"/>
  <!-- back/side static walls -->
  <rect x="0" y="0" width="1600" height="560" fill="#e3d8c2"/>
  <!-- floor -->
  <rect x="0" y="560" width="1600" height="340" fill="#b9ac93"/>

  <!-- paint zone (wall) -->
  <rect x="128" y="162" width="384" height="398" fill="#ede6da" stroke="#c1501f" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="320" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#c1501f">WALL</text>
  <text x="320" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6e6153">paint zone</text>

  <!-- tiling zone (floor) -->
  <rect x="672" y="558" width="608" height="288" fill="#c9c7c1" stroke="#c1501f" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="976" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#c1501f">FLOOR</text>
  <text x="976" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6e6153">tiling zone</text>

  <!-- electrical zone (fixture) -->
  <rect x="704" y="54" width="192" height="126" fill="#e8d9b0" stroke="#c1501f" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="800" cy="105" r="22" fill="#3a3a3a"/>
  <text x="800" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#c1501f">FIXTURE</text>

  <text x="800" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#241e17">PLACEHOLDER &#8212; interior hub</text>
  <text x="800" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6e6153">public/images/house/interior-hub.svg</text>
</svg>
